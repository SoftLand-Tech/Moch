name: android-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Chaquopy requires a real Python 3.11 (buildPython) to prepare the
      # embedded runtime; runner images don't ship python3.11 on PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JS dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      # The repo's release gate (C-04) refuses to build without
      # keystore.properties. On CI we sign with a key generated in the run
      # unless a real one is provided via secrets (MOCH_KEYSTORE_BASE64 =
      # base64 of a keystore.properties file).
      - name: Provide signing config
        working-directory: app/android
        shell: bash
        env:
          MOCH_KEYSTORE_B64: ${{ secrets.MOCH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MOCH_KEYSTORE_B64" ]; then
            echo "$MOCH_KEYSTORE_B64" | base64 -d > keystore.properties
            # Gradle resolves relative storeFile paths against app/android/app/,
            # not this directory — rewrite them to absolute paths.
            SF=$(grep '^storeFile=' keystore.properties | cut -d= -f2-)
            case "$SF" in
              /*) ;;
              *) sed -i "s|^storeFile=.*|storeFile=$PWD/$SF|" keystore.properties ;;
            esac
          else
            keytool -genkeypair -v \
              -keystore "$PWD/ci-release.jks" -alias ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mochci -keypass mochci \
              -dname "CN=Moch CI, OU=CI, O=SoftLand-Tech, C=EG"
            {
              echo "storeFile=$PWD/ci-release.jks"
              echo "storePassword=mochci"
              echo "keyAlias=ci"
              echo "keyPassword=mochci"
            } > keystore.properties
          fi

      - name: Build release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moch-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
