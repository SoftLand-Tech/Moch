name: android-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Chaquopy requires a real Python 3.11 (buildPython) to prepare the
      # embedded runtime; runner images don't ship python3.11 on PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JS dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      # The repo's release gate (C-04) refuses to build without
      # keystore.properties. Signing keys, in priority order:
      #   1. MOCH_KEYSTORE_B64 (base64 keystore binary) +
      #      MOCH_KEYSTORE_PROPS_B64 (base64 keystore.properties) — the REAL
      #      release key: every APK installs over the previous one, and it
      #      matches EAS-built releases. THIS is what production uses.
      #   2. MOCH_KEYSTORE_BASE64 — legacy: properties only (storeFile must
      #      already exist on the runner).
      #   3. Fallback: a fresh per-run key (forks/PRs without secrets).
      #      NOTE: a per-run key means Android refuses an install-over —
      #      the previous app must be uninstalled first.
      - name: Provide signing config
        working-directory: app/android
        shell: bash
        env:
          MOCH_KEYSTORE_B64: ${{ secrets.MOCH_KEYSTORE_B64 }}
          MOCH_KEYSTORE_PROPS_B64: ${{ secrets.MOCH_KEYSTORE_PROPS_B64 }}
          MOCH_KEYSTORE_BASE64: ${{ secrets.MOCH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MOCH_KEYSTORE_B64" ] && [ -n "$MOCH_KEYSTORE_PROPS_B64" ]; then
            echo "$MOCH_KEYSTORE_B64" | base64 -d > moch-release.keystore
            echo "$MOCH_KEYSTORE_PROPS_B64" | base64 -d > keystore.properties
            chmod 600 moch-release.keystore
            # Gradle resolves relative storeFile paths against app/android/app/,
            # not this directory — rewrite them to absolute paths.
            SF=$(grep '^storeFile=' keystore.properties | cut -d= -f2-)
            case "$SF" in
              /*) ;;
              *) sed -i "s|^storeFile=.*|storeFile=$PWD/$SF|" keystore.properties ;;
            esac
            echo "Signed with the stable release key ($(keytool -list -keystore moch-release.keystore -storepass "$(grep '^storePassword=' keystore.properties | cut -d= -f2-)" 2>/dev/null | grep -oE 'moch[a-z]*,[^,]*' | head -1 | cut -d, -f1)) — APKs install over previous releases."
          elif [ -n "$MOCH_KEYSTORE_BASE64" ]; then
            echo "$MOCH_KEYSTORE_BASE64" | base64 -d > keystore.properties
            SF=$(grep '^storeFile=' keystore.properties | cut -d= -f2-)
            case "$SF" in
              /*) ;;
              *) sed -i "s|^storeFile=.*|storeFile=$PWD/$SF|" keystore.properties ;;
            esac
          else
            echo "WARNING: no signing secrets — generating a per-run key." \
                 "This APK will NOT install over other builds (uninstall first)."
            keytool -genkeypair -v \
              -keystore "$PWD/ci-release.jks" -alias ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mochci -keypass mochci \
              -dname "CN=Moch CI, OU=CI, O=SoftLand-Tech, C=EG"
            {
              echo "storeFile=$PWD/ci-release.jks"
              echo "storePassword=mochci"
              echo "keyAlias=ci"
              echo "keyPassword=mochci"
            } > keystore.properties
          fi

      - name: Build release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moch-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  # OTA (expo-updates): publish the JS bundle to the production channel so
  # installed phones pick it up on next launch — no APK download needed.
  # JS/assets changes only; anything native (gradle/py/manifest) must ship
  # as an APK. Runs after the APK job so a broken build never publishes.
  # Skips (with a clear log) until the EXPO_TOKEN secret is set — create an
  # access key on expo.dev → Account Settings → Access Keys, then
  #   gh secret set EXPO_TOKEN
  ota:
    name: Publish OTA update
    runs-on: ubuntu-latest
    needs: apk
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JS dependencies
        working-directory: app
        run: npm ci

      - name: Publish OTA update (production channel)
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret is not set — skipping OTA publish."
            echo "Add it (expo.dev → Access Keys → gh secret set EXPO_TOKEN) to enable updates."
            exit 0
          fi
          SHA_SHORT="${GITHUB_SHA::7}"
          SUBJECT=$(git log -1 --pretty=%s | head -c 140)
          npx --yes eas-cli@latest update \
            --branch production \
            --platform android \
            --message "main@$SHA_SHORT: $SUBJECT" \
            --non-interactive
        shell: bash
