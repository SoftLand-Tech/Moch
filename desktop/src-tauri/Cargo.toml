[package]
name = "moch-desktop"
version = "0.2.0"
description = "Moch Desktop — local-only hermes agent app for PCs (Tauri 2)"
authors = ["Mamoun Hisham"]
license = "MIT"
edition = "2021"

[lib]
name = "moch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
url = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
