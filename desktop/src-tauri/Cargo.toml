[package]
name = "moch-desktop"
version = "0.1.0"
description = "Moch desktop shell — your own hermes agent on the desktop"
authors = ["Mamoun Hisham"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib target unique, and wouldn't conflict with the bin target on
# multi-target builds (iOS, Android), so it's recommended to keep it.
name = "moch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Small binaries matter for Moch desktop — opt for size over speed.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
