        22% { transform: translateY(2px) scale(1.004, 0.996); }
        52% { transform: translateY(-8px) scale(0.996, 1.006); }
        86% { transform: translateY(1px); }
      }
      #mochi-char-10 .face-part {
        transform-origin: 627px 615px;
        animation: glance-10 10.8s ease-in-out -0.20s infinite;
      }
      @keyframes glance-10 {
        0%, 25%, 100% { transform: translate(0px, 0px); }
        30%, 44% { transform: translate(-5px, -3px); }
        48%, 68% { transform: translate(0px, 0px); }
        73%, 86% { transform: translate(5px, -3px); }
      }
      #mochi-char-10 .eye {
        transform-box: fill-box;
        transform-origin: center 65%;
        animation: blink-10 5.2s -0.20s infinite;
      }
      @keyframes blink-10 {
        0%, 68%, 74%, 100% { transform: scaleY(1); }
        71% { transform: scaleY(0.08) translateY(6px); }
      }
    </style>
  
