<?xml version="1.0" encoding="UTF-8"?>
<svg id="mochi-char-15" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="100%" height="100%">
  <defs>
    <linearGradient id="sproutGrad-15" x1="550" y1="380" x2="880" y2="220" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#E76437"/><stop offset="55%" stop-color="#F89236"/><stop offset="100%" stop-color="#FA9F3C"/></linearGradient>
    <linearGradient id="bodyGrad-15" x1="627" y1="300" x2="627" y2="990" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="55%" stop-color="#F8FAFC"/><stop offset="78%" stop-color="#E2E8F0"/><stop offset="92%" stop-color="#CBD5E1"/><stop offset="100%" stop-color="#94A3B8"/></linearGradient>
    <linearGradient id="visorGrad-15" x1="627" y1="400" x2="627" y2="860" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#232A40"/><stop offset="100%" stop-color="#141826"/></linearGradient>
    
    <style>
      #mochi-char-15 .body-part {
        transform-origin: 627px 985px;
        animation: breathe-15 4.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) -2.05s infinite;
      }
      @keyframes breathe-15 {
        0%, 100% { transform: scale(1, 1) translateY(0px); }
        22% { transform: scale(1.018, 0.982) translateY(3px); }
        52% { transform: scale(0.982, 1.028) translateY(-10px); }
        70% { transform: scale(0.988, 1.020) translateY(-7px); }
        86% { transform: scale(1.010, 0.990) translateY(1.5px); }
      }
      #mochi-char-15 .sprout-part {
        transform-origin: 627px 385px;
        animation: sprout-15 4.6s ease-in-out -2.05s infinite;
      }
      @keyframes sprout-15 {
        0%, 100% { transform: rotate(0deg) translateY(0px); }
        25% { transform: rotate(-3.5deg) translateY(2px); }
        55% { transform: rotate(4.5deg) translateY(-9px); }
        80% { transform: rotate(-2deg) translateY(1px); }
      }
      #mochi-char-15 .visor-part {
        transform-origin: 627px 615px;
        animation: visor-15 4.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) -2.05s infinite;
      }
      @keyframes visor-15 {
        0%, 100% { transform: translateY(0px) scale(1); }
        22% { transform: translateY(2px) scale(1.004, 0.996); }
        52% { transform: translateY(-8px) scale(0.996, 1.006); }
        86% { transform: translateY(1px); }
      }
      #mochi-char-15 .face-part {
        transform-origin: 627px 615px;
        animation: glance-15 11.5s ease-in-out -2.05s infinite;
      }
      @keyframes glance-15 {
        0%, 25%, 100% { transform: translate(0px, 0px); }
        30%, 44% { transform: translate(-5px, -3px); }
        48%, 68% { transform: translate(0px, 0px); }
        73%, 86% { transform: translate(5px, -3px); }
      }
      #mochi-char-15 .eye {
        transform-box: fill-box;
        transform-origin: center 65%;
        animation: blink-15 5.2s -2.05s infinite;
      }
      @keyframes blink-15 {
        0%, 68%, 74%, 100% { transform: scaleY(1); }
        71% { transform: scaleY(0.08) translateY(6px); }
      }
    </style>
  
  </defs>
