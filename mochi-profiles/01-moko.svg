      #mochi-char-1 .sprout-part {
        transform-origin: 627px 330px;
        animation: sprout-1 4.2s ease-in-out -0.37s infinite;
      }
      @keyframes sprout-1 {
        0%, 100% { transform: rotate(0deg) translateY(0px); }
        25% { transform: rotate(-3.5deg) translateY(2px); }
        55% { transform: rotate(4.5deg) translateY(-9px); }
        80% { transform: rotate(-2deg) translateY(1px); }
      }
      #mochi-char-1 .visor-part {
        transform-origin: 627px 615px;
        animation: visor-1 4.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) -0.37s infinite;
      }
      @keyframes visor-1 {
        0%, 100% { transform: translateY(0px) scale(1); }
        22% { transform: translateY(2px) scale(1.004, 0.996); }
        52% { transform: translateY(-8px) scale(0.996, 1.006); }
        86% { transform: translateY(1px); }
      }
      #mochi-char-1 .face-part {
        transform-origin: 627px 615px;
        animation: glance-1 10.5s ease-in-out -0.37s infinite;
      }
      @keyframes glance-1 {
        0%, 25%, 100% { transform: translate(0px, 0px); }
        30%, 44% { transform: translate(-5px, -3px); }
        48%, 68% { transform: translate(0px, 0px); }
        73%, 86% { transform: translate(5px, -3px); }
      }
      #mochi-char-1 .eye {
        transform-box: fill-box;
        transform-origin: center 65%;
        animation: blink-1 5.8s -0.37s infinite;
      }
      @keyframes blink-1 {
        0%, 68%, 74%, 100% { transform: scaleY(1); }
        71% { transform: scaleY(0.08) translateY(6px); }
      }
    </style>
  
