        transform-origin: 627px 985px;
        animation: breathe-1 4.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) -0.37s infinite;
      }
      @keyframes breathe-1 {
        0%, 100% { transform: scale(1, 1) translateY(0px); }
        22% { transform: scale(1.018, 0.982) translateY(3px); }
        52% { transform: scale(0.982, 1.028) translateY(-10px); }
        70% { transform: scale(0.988, 1.020) translateY(-7px); }
        86% { transform: scale(1.010, 0.990) translateY(1.5px); }
